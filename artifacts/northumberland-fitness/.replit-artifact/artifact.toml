kind = "web"
previewPath = "/"
title = "Northumberland Fitness"
version = "1.0.0"
id = "artifacts/northumberland-fitness"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21496

[services.development]
run = "pnpm --filter @workspace/northumberland-fitness run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/northumberland-fitness", "run", "build" ]
publicDir = "artifacts/northumberland-fitness/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21496"
BASE_PATH = "/"
